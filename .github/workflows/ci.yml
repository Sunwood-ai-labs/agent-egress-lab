name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python source
        run: python -m py_compile proxy.py fetch_gateway.py
      - name: Validate Compose models
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f offline-e2e.compose.yaml config --quiet
          docker compose -f readonly-fetch.compose.yaml config --quiet

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify agent egress controls
        shell: pwsh
        run: ./verify.ps1
      - name: Verify offline Playwright boundary
        shell: pwsh
        run: ./verify-offline-e2e.ps1
      - name: Verify read-only research gateway
        shell: pwsh
        run: ./verify-readonly-fetch.ps1
      - name: Clean up containers
        if: always()
        shell: pwsh
        run: |
          docker compose down --remove-orphans --volumes
          docker compose -f offline-e2e.compose.yaml down --remove-orphans --volumes
          docker compose -f readonly-fetch.compose.yaml down --remove-orphans --volumes

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run docs:build
