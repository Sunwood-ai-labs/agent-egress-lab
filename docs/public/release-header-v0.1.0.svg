<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Agent Egress Lab v0.1.0</title>
  <desc id="desc">Initial release header showing an internal network, an allowlisted proxy path, and blocked default egress.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#24302b" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#b7ff4a"/>
      <stop offset="1" stop-color="#2e8b68"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0b0f0d"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.75"/>
  <rect x="0" y="0" width="14" height="630" fill="url(#accent)"/>

  <rect x="70" y="66" width="142" height="42" rx="21" fill="#1a251f" stroke="#b7ff4a"/>
  <text x="141" y="94" fill="#b7ff4a" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">v0.1.0</text>
  <text x="70" y="193" fill="#f2f7f3" font-family="Arial, sans-serif" font-size="70" font-weight="800">Agent Egress</text>
  <text x="70" y="270" fill="#f2f7f3" font-family="Arial, sans-serif" font-size="70" font-weight="800">Lab</text>
  <text x="70" y="326" fill="#a8b4ad" font-family="Arial, sans-serif" font-size="25">Default-deny networking for AI agent experiments</text>

  <rect x="70" y="405" width="224" height="52" rx="9" fill="#16201b" stroke="#2e8b68"/>
  <text x="182" y="438" fill="#dff4e8" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">ALLOWLISTED PROXY</text>
  <rect x="310" y="405" width="190" height="52" rx="9" fill="#16201b" stroke="#2e8b68"/>
  <text x="405" y="438" fill="#dff4e8" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">OFFLINE E2E</text>
  <text x="70" y="548" fill="#68766f" font-family="Arial, sans-serif" font-size="17" letter-spacing="2">SUNWOOD AI LABS / INITIAL RELEASE</text>

  <rect x="735" y="78" width="394" height="474" rx="26" fill="#111815" stroke="#2e8b68" stroke-width="3"/>
  <text x="932" y="122" fill="#b7ff4a" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">INTERNAL SECURITY BOUNDARY</text>
  <rect x="790" y="166" width="284" height="78" rx="14" fill="#eaf2ff" stroke="#4c78c2" stroke-width="2"/>
  <text x="932" y="199" fill="#17365d" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">AI Agent / E2E Runner</text>
  <text x="932" y="224" fill="#52677c" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">no default internet route</text>
  <path d="M932 244v52" stroke="#2e8b68" stroke-width="4"/>
  <path d="m924 286 8 12 8-12" fill="none" stroke="#2e8b68" stroke-width="4" stroke-linecap="round"/>
  <rect x="790" y="300" width="284" height="78" rx="14" fill="#e8f7f1" stroke="#2e8b68" stroke-width="2"/>
  <text x="932" y="333" fill="#175c45" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Explicit allowed path</text>
  <text x="932" y="358" fill="#4e7165" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">host:port policy or internal service</text>
  <path d="M932 378v52" stroke="#e15241" stroke-width="4" stroke-dasharray="10 9"/>
  <rect x="820" y="432" width="224" height="74" rx="37" fill="#fff1f0" stroke="#e15241" stroke-width="3"/>
  <text x="932" y="463" fill="#8c2f23" font-family="Arial, sans-serif" font-size="21" font-weight="800" text-anchor="middle">DEFAULT DENY</text>
  <text x="932" y="487" fill="#9a493f" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">external route blocked</text>
</svg>
