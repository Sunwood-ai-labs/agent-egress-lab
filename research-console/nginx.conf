server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /fetch {
        proxy_pass http://fetch-gateway:8080;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host fetch-gateway;
        proxy_set_header Connection close;
    }

    location ~ ^/(analyze|execute)$ {
        proxy_pass http://research-worker:8081;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host research-worker;
        proxy_set_header Content-Type application/json;
        proxy_set_header Connection close;
    }
}
