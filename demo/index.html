<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Offline Playwright E2E sample app">
  <title>Offline Sprint Board</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div>
        <p class="eyebrow">AGENT EGRESS LAB / SAMPLE APP</p>
        <h1>Offline<br><span>Sprint Board</span></h1>
      </div>
      <div class="boundary-badge">
        <small>NETWORK</small>
        <strong>INTERNAL ONLY</strong>
      </div>
    </header>

    <section class="board" aria-labelledby="board-title">
      <div class="section-heading">
        <div>
          <p class="step">PLAYWRIGHT FLOW</p>
          <h2 id="board-title">今日の検証タスク</h2>
        </div>
        <div class="counts" aria-live="polite">
          <span><strong id="openCount">1</strong> OPEN</span>
          <span><strong id="doneCount">0</strong> DONE</span>
        </div>
      </div>

      <form id="taskForm">
        <label for="taskInput">新しいタスク</label>
        <div class="input-row">
          <input id="taskInput" name="task" data-testid="task-input" autocomplete="off" placeholder="例: allowlistを確認" required>
          <button type="submit" data-testid="add-task">追加する</button>
        </div>
      </form>

      <ul id="taskList" class="task-list">
        <li class="task" data-seed="true">
          <label>
            <input type="checkbox" data-testid="task-checkbox">
            <span>内部アプリをPlaywrightで開く</span>
          </label>
          <small>LOCAL SERVICE</small>
        </li>
      </ul>
    </section>

    <section class="egress-check" aria-labelledby="egress-title">
      <div>
        <p class="step">EGRESS CHECK</p>
        <h2 id="egress-title">外部URLも試す</h2>
        <p>このボタンは <code>https://example.com/</code> へ移動します。Offline E2E Runnerでは失敗するのが期待結果です。</p>
      </div>
      <a href="https://example.com/" data-testid="external-link">外部URLを開く <span>↗</span></a>
    </section>

    <footer>
      <span class="pulse" aria-hidden="true"></span>
      <strong>LOCAL APP READY</strong>
      <span>Docker internal network</span>
    </footer>
  </main>
  <script src="./app.js"></script>
</body>
</html>
